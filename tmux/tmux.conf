run-shell '
TMUX_CONF_DIR="#{d:current_file}/tmux.conf.d"
for file in "$TMUX_CONF_DIR"/*; do
  [ -f "$file" ] || continue
  case "$file" in
    *.tmux)
      tmux source-file "$file"
      ;;
    *.async.sh)
      tmux run-shell -b "$file"
      ;;
    *.sh)
      bash "$file"
      ;;
  esac
done
'
